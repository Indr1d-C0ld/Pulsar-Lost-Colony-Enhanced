<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subspace Relay</title>
<style>
  :root {
    --bg:#000; --panel:#11141d; --panel2:#1c2133; --track:#2b3349; --ink:#0a0c12; --text:#ece9df; --dim:#8b90a0;
    --cap:#f2a65a; --pil:#9db4ff; --sci:#5ee0d6; --arm:#ff8073; --eng:#ffd65e; --vio:#c58af9;
    --good:#7cd992; --warn:#f2a65a; --bad:#ff6b5e;
    --font:"Antonio","Oswald","Roboto Condensed","Arial Narrow","Liberation Sans Narrow",sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 var(--font); }
  body { min-height:100vh; }
  button, input, select, textarea { font:inherit; }
  .hide { display:none !important; }

  /* ---- cornice LCARS: gomito in alto a sinistra, barra laterale con pulsanti a pillola */
  .frame { display:grid; grid-template-columns:200px 1fr; grid-template-rows:auto 1fr; min-height:100vh; }
  .elbow { grid-column:1; grid-row:1; background:var(--cap); border-radius:0 0 0 48px; position:relative; min-height:86px; padding:12px 16px; color:var(--ink); }
  .elbow::after { content:""; position:absolute; right:0; bottom:0; width:40px; height:26px; background:var(--bg); border-radius:24px 0 0 0; }
  .elbow b { display:block; font-size:22px; letter-spacing:.08em; }
  .elbow span { font-size:12px; letter-spacing:.12em; }
  .topbar { grid-column:2; grid-row:1; display:flex; align-items:flex-start; gap:6px; padding:0 12px 0 6px; }
  .topbar .rail { height:20px; background:var(--cap); flex:1; }
  .topbar .block { height:20px; border-radius:0 0 10px 10px; padding:0 12px; font-size:12px; letter-spacing:.1em; color:var(--ink); display:flex; align-items:center; white-space:nowrap; }
  .head { display:flex; align-items:baseline; gap:18px; padding:28px 0 8px; flex-wrap:wrap; }
  .head h1 { margin:0; font-size:30px; letter-spacing:.12em; color:var(--cap); text-transform:uppercase; font-weight:600; }
  .head .sub { color:var(--dim); letter-spacing:.1em; font-size:13px; text-transform:uppercase; }
  .side { grid-column:1; grid-row:2; display:flex; flex-direction:column; gap:6px; padding:6px 0 16px; }
  .side button { border:0; text-align:right; padding:14px 18px 6px; min-height:52px; color:var(--ink); font-size:15px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; border-radius:0 26px 26px 0; filter:saturate(.75) brightness(.8); }
  .side button.on, .side button:hover { filter:none; }
  .side button.on { box-shadow:inset -8px 0 0 var(--text); }
  .side .filler { flex:1; background:var(--track); border-radius:0 0 0 30px; min-height:40px; }
  main { grid-column:2; grid-row:2; padding:4px 16px 40px 10px; min-width:0; }

  /* ---- sezioni e mattoni comuni, come le pagine delle stazioni */
  section { background:var(--panel); border-radius:0 18px 18px 0; padding:14px 16px 16px 22px; margin:0 0 14px; position:relative; min-width:0; }
  section::before { content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--acc, var(--pil)); }
  h2 { margin:0 0 2px; font-size:17px; letter-spacing:.14em; text-transform:uppercase; color:var(--acc, var(--pil)); font-weight:600; }
  .help { color:var(--dim); font-size:13px; margin:0 0 10px; }
  h3 { margin:14px 0 6px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:500; }
  .cols2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:0 14px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:14px; }
  .tile { background:var(--panel); border-radius:0 16px 16px 0; padding:8px 12px 8px 16px; border-left:8px solid var(--acc, var(--pil)); }
  .tile b { display:block; font-size:24px; font-variant-numeric:tabular-nums; font-weight:600; }
  .tile span { color:var(--dim); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { color:var(--dim); font-weight:500; font-size:11px; letter-spacing:.12em; text-transform:uppercase; text-align:left; padding:4px 8px; border-bottom:2px solid var(--track); white-space:nowrap; }
  td { padding:5px 8px; border-bottom:1px solid var(--panel2); vertical-align:top; }
  td.n, th.n { text-align:right; }
  .btn { border:0; border-radius:14px; padding:4px 14px; cursor:pointer; color:var(--ink); background:var(--acc, var(--pil)); letter-spacing:.08em; text-transform:uppercase; font-size:13px; white-space:nowrap; display:inline-block; text-decoration:none; }
  .btn.q { background:var(--panel2); color:var(--text); }
  .btn.bad { background:var(--bad); color:var(--ink); }
  .btn.good { background:var(--good); color:var(--ink); }
  .btn:hover { filter:brightness(1.15); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .row.end { justify-content:flex-end; }
  input[type=text], input[type=password], input[type=number], select, textarea { background:#05070b; color:var(--text); border:2px solid var(--track); border-radius:12px; padding:5px 10px; min-width:0; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc, var(--pil)); }
  .grow { flex:1; }
  .tag { display:inline-block; background:var(--panel2); border-radius:10px; padding:1px 9px; font-size:12px; letter-spacing:.06em; margin:2px 4px 2px 0; }
  .tag.good { background:#1e3a29; color:var(--good); } .tag.bad { background:#40201f; color:var(--bad); } .tag.warn { background:#3d2c19; color:var(--warn); }
  .empty { color:var(--dim); }
  .meter { display:grid; grid-template-columns:140px 1fr 56px; gap:8px; align-items:center; font-size:13px; margin:3px 0; }
  .meter i { display:block; height:12px; background:var(--track); position:relative; }
  .meter i u { position:absolute; left:0; top:0; bottom:0; background:var(--good); }
  .meter span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .journal { font-size:13px; color:var(--dim); max-height:240px; overflow:auto; }
  .journal div { padding:1px 0; } .journal b { color:var(--acc, var(--cap)); font-weight:500; margin-right:8px; font-variant-numeric:tabular-nums; }
  pre.log { margin:0; max-height:62vh; overflow:auto; color:#c9c6bd; font:12.5px/1.45 ui-monospace,"DejaVu Sans Mono",monospace; white-space:pre-wrap; }
  canvas { width:100%; height:150px; display:block; background:#05070b; border-radius:0 12px 12px 0; }
  .chart { margin:4px 0 10px; } .chart .lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
  .kv { display:grid; grid-template-columns:180px 1fr; gap:3px 12px; font-size:14px; } .kv span:nth-child(odd) { color:var(--dim); text-transform:uppercase; font-size:12px; letter-spacing:.08em; padding-top:2px; }
  .kv span { overflow-wrap:anywhere; }
  details summary { cursor:pointer; color:var(--dim); font-size:12px; letter-spacing:.1em; text-transform:uppercase; margin:8px 0 4px; }
  .switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  .switch input { width:18px; height:18px; accent-color:var(--bad); }
  .note { font-size:12px; color:var(--dim); }
  .field { display:grid; gap:4px; font-size:12px; color:var(--dim); letter-spacing:.06em; }

  /* ---- accesso */
  .gate { min-height:100vh; display:grid; place-items:center; padding:16px; }
  .gate .box { width:min(460px,100%); }
  .gate .bar { display:flex; gap:6px; } .gate .bar div { height:22px; }
  .gate form { background:var(--panel); padding:22px 24px; border-radius:0 0 26px 0; display:grid; gap:12px; border-left:12px solid var(--cap); }
  .gate label { display:grid; gap:4px; font-size:12px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; }
  .gate h1 { margin:0; color:var(--cap); letter-spacing:.14em; font-size:26px; font-weight:600; }
  .gate .err { color:var(--bad); min-height:20px; font-size:14px; }

  /* ---- finestra di dialogo */
  dialog { background:var(--panel); color:var(--text); border:0; border-left:12px solid var(--acc, var(--cap)); border-radius:0 22px 22px 0; padding:18px 22px; width:min(520px,94vw); }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog h2 { color:var(--acc, var(--cap)); } dialog label { display:grid; gap:4px; font-size:12px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; margin:8px 0; }

  @media (max-width:760px) {
    .frame { grid-template-columns:1fr; }
    .elbow { border-radius:0 0 0 30px; min-height:64px; } .topbar { display:none; }
    .side { grid-column:1; grid-row:2; flex-direction:row; overflow-x:auto; padding:6px 0; }
    .side button { border-radius:20px; min-height:40px; padding:8px 14px; text-align:center; white-space:nowrap; }
    .side .filler { display:none; }
    main { grid-column:1; grid-row:3; padding:4px 12px 30px; }
    .kv { grid-template-columns:1fr; } .meter { grid-template-columns:100px 1fr 46px; }
    .cols2 { grid-template-columns:1fr; }
  }
</style>

<div id="gate" class="gate hide">
  <div class="box">
    <div class="bar"><div style="background:var(--cap);width:90px;border-radius:22px 0 0 0"></div><div style="background:var(--pil);flex:1"></div><div style="background:var(--arm);width:60px"></div></div>
    <form id="loginForm" autocomplete="on">
      <h1>ACCESSO RISERVATO</h1>
      <div class="note">Subspace Relay · console di amministrazione</div>
      <label>Utente<input type="text" id="lu" name="username" autocomplete="username" required></label>
      <label>Codice di accesso<input type="password" id="lp" name="password" autocomplete="current-password" required></label>
      <div class="err" id="lerr"></div>
      <div class="row end"><button class="btn" style="--acc:var(--cap)" type="submit">Autorizza</button></div>
    </form>
  </div>
</div>

<div id="app" class="frame hide">
  <div class="elbow"><b>RELAY</b><span>SUBSPAZIO · LCARS</span></div>
  <div class="topbar">
    <div class="rail"></div>
    <div class="block" style="background:var(--pil)" id="clock">--:--:--</div>
    <div class="block" style="background:var(--sci)" id="hostChip">—</div>
    <div class="block" style="background:var(--arm);cursor:pointer" id="logout">ESCI</div>
  </div>
  <nav class="side" id="nav">
    <button data-tab="plancia" style="background:var(--cap)">Plancia</button>
    <button data-tab="partite" style="background:var(--pil)">Partite</button>
    <button data-tab="equipaggi" style="background:var(--sci)">Equipaggi</button>
    <button data-tab="galassie" style="background:var(--eng)">Galassie</button>
    <button data-tab="classifiche" style="background:var(--vio)">Classifiche</button>
    <button data-tab="sistema" style="background:var(--pil)">Sistema</button>
    <button data-tab="manutenzione" style="background:var(--arm)">Manutenzione</button>
    <button data-tab="registro" style="background:var(--dim)">Registro</button>
    <div class="filler"></div>
  </nav>
  <main>
    <div class="head"><h1 id="title">Plancia</h1><span class="sub" id="subtitle"></span></div>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"><h2 id="dlgTitle"></h2><div class="help" id="dlgHelp"></div><div id="dlgFields"></div>
  <div class="row end"><button class="btn q" value="no" type="submit">Annulla</button><button class="btn" value="ok" type="submit" id="dlgOk">Conferma</button></div></form></dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;
const TABS = { plancia: ['Plancia', 'situazione generale', '--cap'], partite: ['Partite', 'sessioni in corso, plancia e giocatori', '--pil'], equipaggi: ['Equipaggi', 'registro dei giocatori e moderazione', '--sci'],
  galassie: ['Galassie', 'cronache e fazioni rivali', '--eng'], classifiche: ['Classifiche', 'stato di servizio e storico', '--vio'], sistema: ['Sistema', 'telemetria del server e della macchina', '--pil'],
  manutenzione: ['Manutenzione', 'regolazioni, copie di sicurezza, sicurezza', '--arm'], registro: ['Registro', 'eventi del server e azioni dell’amministratore', '--dim'] };
let tab = 'plancia', timer = null, range = 'hour', logFilter = '', userFilter = '', statSel = 'points';
try { tab = location.hash.slice(1) || sessionStorage.getItem('relayTab') || 'plancia'; } catch {}

// ---- formati
const dur = (s) => (s >= 86400 ? `${Math.floor(s / 86400)} g ${Math.floor(s % 86400 / 3600)} h` : s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min` : s >= 60 ? `${Math.floor(s / 60)} min` : `${s} s`);
const when = (t) => (t ? new Date(t).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-');
const clock = (t) => new Date(t).toLocaleTimeString('it-IT');
const num = (v) => (v == null ? '-' : Math.abs(v) >= 100 || Number.isInteger(v) ? Math.round(v).toLocaleString('it-IT', { useGrouping: 'always' }) : Number(v).toLocaleString('it-IT', { maximumFractionDigits: 1 }));
const kb = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(1) + ' KB');
const meter = (label, frac, text, color) => `<div class="meter"><span>${esc(label)}</span><i><u style="width:${Math.max(0, Math.min(100, frac * 100)).toFixed(1)}%;background:${color}"></u></i><span>${esc(text)}</span></div>`;
const health = (v) => (v >= 75 ? 'var(--good)' : v >= 40 ? 'var(--warn)' : 'var(--bad)');
const tile = (label, value, acc) => `<div class="tile" style="--acc:var(${acc || '--pil'})"><b>${esc(value)}</b><span>${esc(label)}</span></div>`;
const sec = (title, help, inner, acc) => `<section style="--acc:var(${acc || '--pil'})"><h2>${esc(title)}</h2>${help ? `<p class="help">${esc(help)}</p>` : ''}${inner}</section>`;

// ---- rete
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { ...(opt.headers || {}), ...(opt.method === 'POST' ? { 'x-mel': '1', 'content-type': 'application/json' } : {}) }, credentials: 'same-origin' });
  if (r.status === 401) { showGate(); throw new Error('accesso richiesto'); }
  return r.json();
}
const act = (path, body) => api(path, { method: 'POST', body: body ? JSON.stringify(body) : undefined });

// ---- finestra di dialogo LCARS: conferme e campi
function ask(title, help, fields = [], acc = '--cap', okText = 'Conferma') {
  return new Promise((resolve) => {
    const d = $('dlg'); d.style.setProperty('--acc', `var(${acc})`); $('dlgTitle').textContent = title; $('dlgHelp').textContent = help || ''; $('dlgOk').textContent = okText;
    $('dlgFields').innerHTML = fields.map((f, i) => f.type === 'select'
      ? `<label>${esc(f.label)}<select id="f${i}">${f.options.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`
      : f.type === 'textarea' ? `<label>${esc(f.label)}<textarea id="f${i}" rows="4">${esc(f.value || '')}</textarea></label>`
      : `<label>${esc(f.label)}<input id="f${i}" type="${f.type || 'text'}" value="${esc(f.value || '')}" ${f.max ? `maxlength="${f.max}"` : ''} autocomplete="${f.ac || 'off'}"></label>`).join('');
    d.onclose = () => resolve(d.returnValue === 'ok' ? fields.map((f, i) => $('f' + i).value) : null);
    d.returnValue = ''; d.showModal(); const first = $('f0'); if (first) first.focus();
  });
}

// ---- accesso
function showGate() { clearInterval(timer); $('app').classList.add('hide'); $('gate').classList.remove('hide'); $('lu').focus(); }
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('lerr').textContent = '';
  const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', body: JSON.stringify({ user: $('lu').value, pass: $('lp').value }) });
  const o = await r.json().catch(() => ({}));
  if (!o.ok) { $('lerr').textContent = o.error || 'Accesso negato'; $('lp').value = ''; return; }
  $('lp').value = ''; start();
});
$('logout').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); location.reload(); });

async function start() {
  const me = await (await fetch('/api/me', { credentials: 'same-origin' })).json();
  if (!me.ok) return showGate();
  $('gate').classList.add('hide'); $('app').classList.remove('hide');
  select(tab);
}

function select(t) {
  tab = TABS[t] ? t : 'plancia'; try { sessionStorage.setItem('relayTab', tab); history.replaceState(null, '', '#' + tab); } catch {}
  for (const b of $('nav').querySelectorAll('button')) b.classList.toggle('on', b.dataset.tab === tab);
  const [name, sub, acc] = TABS[tab]; $('title').textContent = name; $('title').style.color = `var(${acc})`; $('subtitle').textContent = sub;
  $('view').innerHTML = '<p class="empty">Collegamento in corso…</p>';
  clearInterval(timer); refresh(true);
  // la scheda delle regolazioni non si ridisegna da sola, per non cancellare quello che si sta scrivendo
  if (tab !== 'manutenzione') timer = setInterval(refresh, tab === 'registro' ? 4000 : 2500);
}
$('nav').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) select(b.dataset.tab); });
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('it-IT'); }, 1000);

// ---- grafici: linee piatte su griglia, nei colori delle stazioni
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function chart(id, series, opts = {}) {
  const c = $(id); if (!c) return; const dpr = window.devicePixelRatio || 1; const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const all = series.flatMap((s) => s.data); const top = Math.max(opts.min || 1, ...all); const max = top * 1.15; const n = Math.max(2, ...series.map((s) => s.data.length));
  g.strokeStyle = '#2b3349'; g.lineWidth = 1; for (let i = 1; i < 4; i++) { const y = h - (h * i) / 4; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.fillStyle = '#8b90a0'; g.font = '11px sans-serif'; g.fillText('max ' + num(top) + (opts.unit || ''), 8, 14);
  if (!all.length) { g.fillText('in attesa dei primi campioni', 8, h / 2); return; }
  for (const s of series) {
    g.strokeStyle = s.color; g.lineWidth = 2; g.beginPath();
    s.data.forEach((v, i) => { const x = (i / (n - 1)) * w, y = h - 4 - (v / max) * (h - 10); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
  }
}

// ---- schede
const SYS = [['shields', 'Scudi'], ['weapons', 'Armi'], ['engines', 'Motori'], ['sensors', 'Sensori'], ['warp', 'Curvatura'], ['life', 'Supporto vitale']];
const ORDERS = ['nessuno', 'battaglia', 'danni', 'regime', 'silenzio'], DOCS = ['nessuna', 'precisa', 'rapida', 'continua'], AIMS = ['misto', 'scudi', 'scafo'], BANDS = ['nessuna', 'corta', 'media', 'lunga'], PHASES = ['calma', 'allerta', 'crisi', 'respiro'];
const repLevel = (v) => v <= -60 ? 'guerra aperta' : v <= -25 ? 'ostilità' : v <= -10 ? 'diffidenza' : v < 10 ? 'neutralità' : v < 35 ? 'cordialità' : v < 70 ? 'alleanza' : 'leggenda';
const FACTIONS = { 0: 'Colonial Union', 1: 'Alliance of Gentlemen', 2: 'W.D. Corporation', 3: 'Fluffy Biscuit', 4: 'Infetti', 5: 'Polytechnic' };
const PROTO = ['squadre danni', 'fuoco mirato', 'scansione prioritaria', 'disciplina termica'];
const BANTIME = [['0', 'Per sempre'], ['60', '1 ora'], ['1440', '1 giorno'], ['10080', '1 settimana'], ['43200', '30 giorni']];

function shipCard(sh, own) {
  const v = sh.values, g = (k) => v[k] || 0;
  if (!own) return `<h3>Nave incontrata ${sh.id} · dati di ${sh.ageSec} s fa</h3>` + SYS.map(([id, n]) => { const x = 100 - g('dmx_' + id); return meter(n, x / 100, x.toFixed(0) + '%', health(x)); }).join('');
  const stress = g('core_stress'), tags = [`situazione ${PHASES[Math.round(g('drx_phase'))] || '?'}`, `tensione ${g('drx_t').toFixed(0)}`, `potenza ${g('drx_pow').toFixed(1)}`, `ordine ${ORDERS[g('cpx_dir')] || '?'}`, `dottrina ${DOCS[g('wpx_doc')] || '?'}`, `mira ${AIMS[g('wpx_aim')] || '?'}`, `fascia ${BANDS[g('plx_band')] || '?'}`];
  if (g('wpx_sub')) tags.push('bersaglio ' + (SYS[g('wpx_sub') - 1] || [0, '?'])[1].toLowerCase());
  PROTO.forEach((p, i) => { if ((g('cpx_proto') >> i) & 1) tags.push('protocollo ' + p); });
  if (g('core_lock')) tags.push('NUCLEO IN ARRESTO ' + g('core_lock') + ' s');
  return `<h3>Plancia dell’equipaggio · dati di ${sh.ageSec} s fa</h3><div class="cols2"><div>
    ${meter('Stress nucleo', stress / 100, stress.toFixed(0) + '%', stress >= 85 ? 'var(--bad)' : stress >= 60 ? 'var(--warn)' : 'var(--good)')}
    ${meter('Iniziativa', (g('cpx_ini') || 50) / 100, (g('cpx_ini') || 50).toFixed(0), 'var(--cap)')}
    ${meter('Armonica scudi', g('scx_eff') / 100, g('scx_band') ? g('scx_eff').toFixed(0) + '%' : 'spenta', 'var(--sci)')}
    ${meter('Soluzione di tiro', g('wpx_q') / 100, g('wpx_doc') ? g('wpx_q').toFixed(0) + '%' : '-', 'var(--arm)')}
    ${meter('Scansione', g('scx_scan') / 100, g('scx_tgt') ? g('scx_scan').toFixed(0) + '%' : '-', 'var(--sci)')}
    ${meter('Posizione', g('plx_pos') / 100, g('plx_band') ? g('plx_pos').toFixed(0) + '%' : '-', 'var(--pil)')}
    <div style="margin-top:6px">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>
    <div>${SYS.map(([id, n]) => { const x = 100 - g('dmx_' + id); return meter(n, x / 100, x.toFixed(0) + '%', health(x)); }).join('')}</div></div>`;
}

const renderers = {
  async plancia() {
    const [s, sys, tel, logs] = await Promise.all([api('/api/status'), api('/api/system'), api('/api/telemetry'), api('/api/log?n=12')]);
    const last = tel[tel.length - 1] || {};
    const alerts = [];
    if (s.maintenance) alerts.push('<span class="tag bad">server in manutenzione: non entrano nuovi giocatori</span>');
    const bans = s.bans.users.length + s.bans.addresses.length; if (bans) alerts.push(`<span class="tag warn">${bans} esclusioni attive</span>`);
    if (last.lagMs > 50) alerts.push(`<span class="tag warn">ciclo di eventi lento: ${last.lagMs} ms</span>`);
    if (sys.disk && sys.disk.freeGB < 2) alerts.push(`<span class="tag bad">disco quasi pieno: ${sys.disk.freeGB} GB liberi</span>`);
    return `<div class="tiles">${tile('Attivo da', dur(s.uptimeSec), '--cap')}${tile('Partite', s.rooms.length, '--pil')}${tile('In gioco', s.gamePeers, '--sci')}${tile('In lobby', s.masterPeers, '--sci')}
      ${tile('Eventi al secondo', num(last.events || 0), '--eng')}${tile('Traffico', `${num((last.inKBs || 0) + (last.outKBs || 0))} KB/s`, '--eng')}${tile('CPU del relay', `${num(last.cpu || 0)}%`, '--arm')}${tile('Memoria del relay', `${sys.rssMB} MB`, '--arm')}
      ${tile('Accessi', num(s.stats.logins), '--vio')}${tile('Rifiutati', num(s.stats.rejected), '--vio')}${tile('Eventi inoltrati', num(s.stats.eventsRelayed), '--vio')}${tile('Dati trasmessi', kb(sys.totals.bytesIn + sys.totals.bytesOut), '--vio')}</div>
      ${alerts.length ? sec('Avvisi', '', alerts.join(''), '--arm') : ''}
      <div class="cols2"><div>${sec('Ultima ora', 'Campioni ogni 5 secondi.', `<div class="chart"><div class="lbl"><span style="color:var(--sci)">Giocatori</span><span style="color:var(--eng)">Eventi/s</span></div><canvas id="c1"></canvas></div>
        <div class="chart"><div class="lbl"><span style="color:var(--pil)">Ricevuti KB/s</span><span style="color:var(--cap)">Inviati KB/s</span></div><canvas id="c2"></canvas></div>`, '--cap')}</div>
      <div>${sec('Partite in corso', '', s.rooms.length ? `<table><tr><th>Partita</th><th class="n">Giocatori</th><th class="n">Eventi/s</th><th>Da</th></tr>${s.rooms.map((r) => `<tr><td>${esc(r.name)}${r.open ? '' : ' <span class="tag bad">chiusa</span>'}</td><td class="n">${r.actors.length}/${r.maxPlayers || '∞'}</td><td class="n">${num(r.eventsPerSec)}</td><td>${dur(r.ageSec)}</td></tr>`).join('')}</table>` : '<p class="empty">Nessuna partita in corso.</p>', '--pil')}
        ${sec('Ultimi eventi', '', `<pre class="log">${esc(logs.slice(-12).join('\n'))}</pre>`, '--dim')}</div></div>`;
  },

  async partite() {

    const lobby = s.lobby.length ? `<div class="scroll"><table><tr><th>Indirizzo</th><th>Versione</th><th>In lobby</th><th>Collegato da</th></tr>${s.lobby.map((l) => `<tr><td>${esc(l.address)}</td><td>${esc(l.version)}</td><td>${l.inLobby ? 'sì' : 'no'}</td><td>${dur(l.connectedSec)}</td></tr>`).join('')}</table></div>` : '<p class="empty">Nessuno nella lobby.</p>';

      const rn = esc(r.name); const own = r.ships.slice().sort((a, b) => Object.keys(b.values).length - Object.keys(a.values).length)[0];
      return sec(r.name, `${r.actors.length}/${r.maxPlayers || '∞'} giocatori · ${r.open ? 'aperta' : 'chiusa'} · ${r.visible ? 'visibile' : 'nascosta'} · attiva da ${dur(r.ageSec)} · ${num(r.eventsPerSec)} eventi/s · ${num(r.eventsRelayed)} eventi · picco ${r.peak} giocatori · ${r.cachedEvents} eventi in cache`, `
        <div class="row"><button class="btn q" data-a="room" data-room="${rn}" data-q="open=${r.open ? 0 : 1}">${r.open ? 'Chiudi ingressi' : 'Riapri ingressi'}</button>
          <button class="btn q" data-a="room" data-room="${rn}" data-q="visible=${r.visible ? 0 : 1}">${r.visible ? 'Nascondi' : 'Mostra'}</button>
          <button class="btn q" data-a="max" data-room="${rn}">Capienza</button><button class="btn" data-a="say" data-room="${rn}" style="--acc:var(--cap)">Messaggio alla partita</button>
          <button class="btn bad" data-a="close" data-room="${rn}">Termina</button></div>
        <div class="scroll"><table><tr><th>N.</th><th>Nome</th><th>Indirizzo</th><th>Versione</th><th class="n">Collegato</th><th class="n">Ricevuti</th><th class="n">Inviati</th><th class="n">Inattivo</th><th></th></tr>
        ${r.actors.map((a) => `<tr><td>${a.nr}${a.isMaster ? ' <span class="tag good">host</span>' : ''}</td><td>${esc(a.name)}</td><td>${esc(a.ip)}</td><td>${esc(a.version)}</td><td class="n">${dur(a.connectedSec)}</td><td class="n">${kb(a.bytesIn)}</td><td class="n">${kb(a.bytesOut)}</td><td class="n">${a.idleSec} s</td>
          <td><div class="row"><button class="btn q" data-a="whisper" data-room="${rn}" data-actor="${a.nr}">Messaggio</button><button class="btn q" data-a="warn" data-room="${rn}" data-actor="${a.nr}">Avviso</button>
          <button class="btn q" data-a="kick" data-room="${rn}" data-actor="${a.nr}">Espelli</button><button class="btn bad" data-a="ban" data-user="${esc(a.userId)}" data-name="${esc(a.name)}">Escludi</button></div></td></tr>`).join('')}</table></div>
        ${own ? shipCard(own, true) : '<h3>Plancia</h3><p class="empty">Nessun dato dalle stazioni.</p>'}
        ${r.ships.filter((x) => x !== own).slice(0, 6).map((x) => shipCard(x, false)).join('')}
        <h3>Giornale di bordo</h3><div class="journal" style="--acc:var(--pil)">${r.journal.length ? r.journal.slice().reverse().map((j) => `<div><b>${clock(j.t)}</b>${esc(j.text)}</div>`).join('') : '<span class="empty">Nessun evento.</span>'}</div>
        <details><summary>Proprietà della partita</summary><div class="kv">${Object.entries(r.props).map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div></details>`, '--pil');
    }).join('');
    return sec('Annuncio a tutte le partite', 'Compare a schermo e nel giornale di bordo di ogni giocatore.', `<div class="row"><input type="text" id="annText" class="grow" maxlength="200" placeholder="Testo dell'annuncio"><button class="btn" data-a="annAll" style="--acc:var(--cap)">Trasmetti</button></div>`, '--cap')
      + (rooms || sec('Partite', '', '<p class="empty">Nessuna partita in corso.</p>')) + sec('Lobby', 'Giocatori collegati al master server, non ancora in una partita.', lobby, '--sci');
  },

  async equipaggi() {
    const [us, s] = await Promise.all([api('/api/users'), api('/api/status')]);
    const f = userFilter.toLowerCase(); const list = us.filter((u) => !f || [u.id, ...(u.names || []), ...(u.ips || [])].join(' ').toLowerCase().includes(f));
    const banRow = (b, kind) => `<tr><td>${kind}</td><td>${esc(b.id)}</td><td>${esc(b.reason || '-')}</td><td>${when(b.at)}</td><td>${b.until ? 'fino al ' + when(b.until) : 'per sempre'}</td><td><button class="btn q" data-a="unban" data-k="${kind === 'Giocatore' ? 'userId' : 'address'}" data-v="${esc(b.id)}">Riammetti</button></td></tr>`;
    const nb = s.bans.users.length + s.bans.addresses.length;
    return `<div class="tiles">${tile('Giocatori conosciuti', us.length, '--sci')}${tile('In linea', us.filter((u) => u.online).length, '--sci')}${tile('Esclusioni', nb, '--arm')}${tile('Avvisi dati', us.reduce((n, u) => n + (u.warnings || 0), 0), '--cap')}</div>`
      + sec('Registro dei giocatori', 'Cerca per nome, identificativo o indirizzo (Invio per filtrare).', `
      <div class="row"><input type="text" id="userQ" class="grow" placeholder="Cerca" value="${esc(userFilter)}"></div>
      <div class="scroll"><table><tr><th>Stato</th><th>Nomi</th><th>Identificativo</th><th>Indirizzi</th><th>Versione</th><th class="n">Accessi</th><th class="n">Avvisi</th><th>Prima volta</th><th>Ultima volta</th><th>Note</th><th></th></tr>
      ${list.map((u) => `<tr><td>${u.banned ? '<span class="tag bad">escluso</span>' : u.online ? '<span class="tag good">in linea</span>' : '<span class="tag">fuori linea</span>'}</td><td>${esc((u.names || []).join(', ') || '-')}</td><td title="${esc(u.id)}">${esc(u.id.slice(0, 8))}…</td><td>${esc((u.ips || []).join(', '))}</td><td>${esc(u.version || '')}</td>

        <td><div class="row"><button class="btn q" data-a="note" data-user="${esc(u.id)}" data-notes="${esc(u.notes || '')}">Nota</button>${u.online ? `<button class="btn q" data-a="kickuser" data-user="${esc(u.id)}">Scollega</button>` : ''}
        ${u.banned ? `<button class="btn good" data-a="unban" data-k="userId" data-v="${esc(u.id)}">Riammetti</button>` : `<button class="btn bad" data-a="ban" data-user="${esc(u.id)}" data-name="${esc((u.names || [])[0] || u.id)}">Escludi</button>`}</div></td></tr>`).join('') || '<tr><td colspan="11" class="empty">Nessun giocatore.</td></tr>'}</table></div>`, '--sci')
      + sec('Esclusioni', 'Giocatori e indirizzi che non possono entrare. Un’esclusione a tempo scade da sola.', `

        ${Object.keys(g.standing || {}).length ? `<h3>Reputazione dell’equipaggio</h3>${Object.entries(g.standing).map(([f, v]) => meter((FACTIONS[f] || f) + ' · ' + repLevel(v), (v + 100) / 200, (v > 0 ? '+' : '') + v, v <= -25 ? 'var(--bad)' : v >= 35 ? 'var(--good)' : 'var(--arm)')).join('')}` : ''}

        ${(g.discovered || (g.discoveries || []).length) ? `<h3>Atlante delle scoperte</h3><div class="row"><span class="tag">${g.discovered || 0} luoghi esplorati</span><span class="tag">frammenti di mappa ${g.fragments || 0}/3</span><span class="tag">${g.legendsFound || 0} luoghi leggendari</span>${g.legend ? `<span class="tag warn">in cerca di ${esc(g.legend.name)} · settore ${g.legend.sector}</span>` : ''}</div>${(g.discoveries || []).slice(-6).reverse().map((d) => `<div class="note">${when(d.t)} · settore ${d.sector} · ${esc(d.name)}</div>`).join('')}` : ''}

        ${(g.officers || []).length ? `<h3>Ufficiali</h3><div class="scroll"><table><tr><th>Stazione</th><th>Ufficiale</th><th>Tratto</th><th>Esperienza</th><th>Imprese</th><th>Competenze</th><th>Lealtà</th><th>Desiderio</th><th>Legami</th><th>Stato</th></tr>${g.officers.map((o) => `<tr style="${o.alive ? '' : 'opacity:.45'}"><td>${['Comando', 'Timone', 'Scienza', 'Armi', 'Ingegneria'][o.cls] || o.cls}</td><td>${esc(['Guardiamarina', 'Sottotenente di vascello', 'Tenente di vascello', 'Capitano di corvetta', 'Capitano di fregata'][o.rank] || '')} ${esc(o.first)} ${esc(o.last)}</td><td>${esc(o.trait)}</td><td>${o.xp}</td><td>${o.deeds}</td><td>${Object.entries(o.skills || {}).map(([k, v]) => k === 'ferite' ? `ferite ${v}` : `${esc(k)} ${[0, 10, 25, 45, 70, 100, 140, 190, 250, 320, 400].filter((t) => v >= t).length - 1}`).join(', ')}</td><td>${o.loyalty ?? ''}</td><td>${esc(o.wish || '')}${o.wish === 'porto' || o.wish === 'crediti' ? ' ' + o.wishArg : ''}</td><td>${o.friend ? 'amico di ' + esc(o.friend) : ''}${o.rival ? ' rivale di ' + esc(o.rival) : ''}</td><td>${o.alive ? (o.injuredUntil > (g.jumps || 0) ? 'in infermeria' : 'in servizio') : o.left ? 'congedato' : 'caduto'}</td></tr>`).join('')}</table></div>` : ''}
        ${(g.competitors || []).length ? `<h3>Liberi equipaggi</h3>${[...g.competitors.map((c) => ({ n: `«${c.ship}» di ${c.captain}`, s: c.score, r: c.relation })), { n: 'il nostro equipaggio', s: g.renown || 0, us: true }].sort((a, b) => b.s - a.s).map((x, i) => `<div class="note">${i + 1}° ${x.us ? '<b>' + esc(x.n) + '</b>' : esc(x.n)} · fama ${x.s}${x.us ? '' : ' · rapporti ' + x.r}</div>`).join('')}` : ''}
        ${(g.bases || []).length || (g.deeds || []).length ? `<h3>Basi e atti di fondazione</h3>${(g.bases || []).length ? `<div class="scroll"><table><tr><th>Base</th><th>Tipo</th><th>Settore</th><th>Livello</th><th>Difese</th><th>Scorte</th><th>Resa</th><th>Stato</th></tr>${g.bases.map((b) => `<tr><td>${esc(b.name)}</td><td>${esc(b.kind)}</td><td>${b.sector}</td><td>${b.level}</td><td>${b.defense}</td><td>${b.supply}%</td><td>${num(b.earned || 0)} Cr</td><td>${b.state === 0 ? 'in costruzione' : b.raidUntil > (g.jumps || 0) ? '<b style="color:var(--bad)">sotto attacco</b>' : 'operativa'}</td></tr>`).join('')}</table></div>` : ''}${(g.deeds || []).length ? `<div class="row">${g.deeds.map((d) => `<span class="tag">atto: ${esc(d.kind)} · ${esc(d.source)}</span>`).join('')}</div>` : ''}` : ''}

        ${(g.loans || []).length ? `<div class="row">${g.loans.map((l) => `<span class="tag">prestito a ${esc(l.name)} («${esc(l.ship)}»): ${num(l.amount)} Cr, scadenza salto ${l.due}</span>`).join('')}</div>` : ''}
        ${g.escort ? `<div class="note"><b style="color:var(--warn)">SCORTA</b> «${esc(g.escort.ship)}» verso il settore ${g.escort.dest}, ${num(g.escort.reward)} Cr all'arrivo, entro il salto ${g.escort.until}</div>` : ''}
        ${(g.fleets || []).length ? `<h3>Flotte in movimento</h3><div class="row">${g.fleets.map((f) => `<span class="tag">${esc(f.kind)} ${esc(f.name)} → settore ${f.dest}</span>`).join('')}</div>` : ''}
        ${(g.board || []).length ? `<h3>Bacheca</h3>${g.board.map((o) => `<div class="note">${o.urgent ? '<b style="color:var(--bad)">URGENTE</b> ' : ''}${o.kind === 'taglia' ? '<b style="color:var(--warn)">TAGLIA</b> ' : ''}${esc(o.title)} · ${esc(o.issuer)} · ${num(o.reward)} Cr</div>`).join('')}` : ''}

        ${(g.captainLog || []).length ? `<h3>Diario del capitano</h3><div class="journal" style="--acc:var(--cap)">${g.captainLog.slice().reverse().slice(0, 6).map((e) => `<div><b>${esc(e.stardate)}</b>${esc(e.text)}</div>`).join('')}</div>` : ''}

  async classifiche() {
    const [sum, ses, pl, wk] = await Promise.all([api('/api/summary'), api('/api/sessions?n=40'), api('/api/players'), api('/api/challenge')]);
    const keys = Object.keys(sum.totals).sort(); if (statSel !== 'points' && !keys.includes(statSel)) statSel = 'points';
    const board = await api('/api/leaderboard?n=50&stat=' + enc(statSel));
    const weekly = sec('Sfida della settimana', `${wk.label}. Si chiude ${when(wk.ends)}.`, wk.board && wk.board.length ? `<div class="scroll"><table><tr><th>#</th><th>Nave</th><th>Galassia</th><th>Progresso</th><th></th></tr>${wk.board.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.ship)}</td><td>${r.seed}</td><td>${r.progress}/${wk.target}</td><td>${r.done ? '<span class="tag">completata</span>' : ''}</td></tr>`).join('')}</table></div>` : '<p class="empty">Nessun equipaggio in gara, per ora.</p>', '--cap');
    return weekly + `<div class="tiles">${tile('Giocatori', sum.players, '--vio')}${tile('Attivi in settimana', sum.activeLastWeek, '--vio')}${tile('Partite concluse', sum.sessions, '--pil')}${tile('Ore giocate', num(sum.hoursPlayed), '--pil')}${tile('Partita più lunga', dur(sum.longestSessionSec), '--cap')}${tile('Punti totali', num(sum.pointsTotal), '--cap')}</div>`
      + sec('Classifica', '', `<div class="row"><span class="note">Ordina per</span><select id="statSel"><option value="points">Punti di servizio</option>${keys.map((k) => `<option ${k === statSel ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></div>
        <div class="scroll"><table><tr><th>#</th><th>Nome</th><th>Grado</th><th class="n">${statSel === 'points' ? 'Punti' : esc(statSel)}</th>${statSel === 'points' ? '' : '<th class="n">Punti</th>'}<th>Ultima sincronizzazione</th></tr>
        ${board.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.rank)}</td><td class="n">${num(r.value)}</td>${statSel === 'points' ? '' : `<td class="n">${num(r.points)}</td>`}<td>${when(r.seen)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nessun giocatore.</td></tr>'}</table></div>`, '--vio')
      + sec('Statistiche globali', 'Somma di ogni voce su tutti i giocatori, con il primatista.', keys.length ? `<div class="scroll"><table><tr><th>Voce</th><th class="n">Totale</th><th>Primato</th><th class="n">Valore</th></tr>${keys.map((k) => `<tr><td>${esc(k)}</td><td class="n">${num(sum.totals[k])}</td><td>${esc(sum.best[k].name)}</td><td class="n">${num(sum.best[k].value)}</td></tr>`).join('')}</table></div>` : '<p class="empty">Ancora nessuna statistica.</p>', '--vio')
      + sec('Partite concluse', '', ses.length ? `<div class="scroll"><table><tr><th>Partita</th><th>Inizio</th><th>Durata</th><th>Equipaggio</th><th class="n">Picco</th><th class="n">Eventi</th><th>Ultimo evento</th></tr>${ses.map((x) => `<tr><td>${esc(x.name)}</td><td>${when(x.started)}</td><td>${dur(x.durationSec)}</td><td>${esc(x.players.join(', '))}</td><td class="n">${x.peak || '-'}</td><td class="n">${num(x.events)}</td><td>${esc(x.journal.length ? x.journal[x.journal.length - 1].text : '-')}</td></tr>`).join('')}</table></div>` : '<p class="empty">Nessuna partita conclusa.</p>', '--pil')
      + sec('Profili di servizio', 'Stato di servizio inviato dai giocatori. Eliminare un profilo non tocca il gioco del giocatore.', pl.length ? `<div class="scroll"><table><tr><th>Nome</th><th>Grado</th><th class="n">Punti</th><th>Prima volta</th><th>Ultima volta</th><th class="n">Giorni attivi</th><th></th></tr>${pl.map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(p.rank)}</td><td class="n">${num(p.points)}</td><td>${when(p.first || p.seen)}</td><td>${when(p.seen)}</td><td class="n">${Object.keys(p.history || {}).length}</td><td><button class="btn bad" data-a="delplayer" data-id="${esc(p.id)}" data-name="${esc(p.name)}">Elimina</button></td></tr>`).join('')}</table></div>` : '<p class="empty">Nessun profilo.</p>', '--cap');
  },

  async sistema() {
    const sys = await api('/api/system');
    const d = sys.disk; const memUsed = sys.memTotalMB - sys.memFreeMB;
    return `<div class="row"><button class="btn ${range === 'hour' ? '' : 'q'}" data-a="range" data-r="hour">Ultima ora</button><button class="btn ${range === 'day' ? '' : 'q'}" data-a="range" data-r="day">Ultime 24 ore</button></div>
      <div class="cols2"><div>${sec('Rete', 'Traffico del relay verso e dai giocatori.', `<div class="chart"><div class="lbl"><span style="color:var(--pil)">Ricevuti KB/s</span><span style="color:var(--cap)">Inviati KB/s</span></div><canvas id="s1"></canvas></div>
        <div class="chart"><div class="lbl"><span style="color:var(--eng)">Eventi inoltrati al secondo</span><span style="color:var(--sci)">Giocatori</span></div><canvas id="s2"></canvas></div>`, '--pil')}</div>
      <div>${sec('Processo', 'Carico del relay su questa macchina.', `<div class="chart"><div class="lbl"><span style="color:var(--arm)">CPU %</span><span style="color:var(--vio)">Memoria (decine di MB)</span></div><canvas id="s3"></canvas></div>
        ${range === 'hour' ? `<div class="chart"><div class="lbl"><span style="color:var(--warn)">Ritardo medio del ciclo di eventi (ms)</span><span style="color:var(--bad)">massimo</span></div><canvas id="s4"></canvas></div>` : ''}`, '--arm')}</div></div>
      <div class="cols2"><div>${sec('Macchina', '', `<div class="kv"><span>Nome</span><span>${esc(sys.host)}</span><span>Sistema</span><span>${esc(sys.platform)}</span><span>Processore</span><span>${esc(sys.cpuModel)} · ${sys.cpus} core</span>
        <span>Carico medio</span><span>${sys.load.join(' · ')} (1, 5, 15 min)</span><span>Accesa da</span><span>${dur(sys.osUptimeSec)}</span><span>Indirizzi</span><span>${esc(sys.interfaces.join(', '))}</span></div>
        ${meter('Memoria', memUsed / sys.memTotalMB, `${Math.round(memUsed / sys.memTotalMB * 100)}%`, memUsed / sys.memTotalMB > 0.9 ? 'var(--bad)' : 'var(--sci)')}<div class="note">${num(memUsed)} MB usati su ${num(sys.memTotalMB)} MB</div>
        ${d ? meter('Disco dei dati', 1 - d.freeGB / d.totalGB, `${Math.round((1 - d.freeGB / d.totalGB) * 100)}%`, d.freeGB < 2 ? 'var(--bad)' : 'var(--sci)') + `<div class="note">${d.freeGB} GB liberi su ${d.totalGB} GB</div>` : ''}`, '--sci')}</div>
      <div>${sec('Relay', '', `<div class="kv"><span>Processo</span><span>PID ${sys.pid} · Node ${esc(sys.node)}</span><span>Attivo da</span><span>${dur(sys.uptimeSec)}</span><span>Memoria</span><span>${sys.rssMB} MB residenti · heap ${sys.heapMB}/${sys.heapTotalMB} MB</span>
        <span>Dati salvati</span><span>${num(sys.dataKB)} KB in ${esc(sys.dataDir || '')}</span><span>Configurazione</span><span>${esc(sys.configPath)}</span>
        <span>Traffico totale</span><span>${kb(sys.totals.bytesIn)} ricevuti · ${kb(sys.totals.bytesOut)} inviati</span><span>Messaggi</span><span>${num(sys.totals.msgsIn)} ricevuti · ${num(sys.totals.msgsOut)} inviati</span>
        <span>Picchi</span><span>${sys.peaks.players} giocatori · ${sys.peaks.rooms} partite · ${num(sys.peaks.eventsPerSec)} eventi/s · ${num(sys.peaks.bytesPerSec)} KB/s</span>
        <span>Porte</span><span>master ${sys.config.masterPort} · partite ${sys.config.gamePort} · pannello ${sys.config.adminPort}</span><span>Indirizzo pubblico</span><span>${esc(sys.config.publicHost)}</span></div>`, '--pil')}</div></div>`;
  },

  async manutenzione() {
    const [sys, bk, ad] = await Promise.all([api('/api/system'), api('/api/backups'), api('/api/admins')]);
    const c = sys.config;
    return `<div class="cols2"><div>${sec('Regolazioni del server', 'Si applicano subito e restano salvate nella configurazione.', `
        <label class="switch"><input type="checkbox" id="setMaint" ${c.maintenance ? 'checked' : ''}> Modalità manutenzione: non entrano nuovi giocatori</label>
        <div class="row"><input type="text" id="setMaintMsg" class="grow" maxlength="120" placeholder="Messaggio di manutenzione" value="${esc(c.maintenanceMessage || '')}"></div>
        <h3>Messaggio di benvenuto</h3><div class="row"><input type="text" id="setMotd" class="grow" maxlength="200" value="${esc(c.motd || '')}"></div>
        <div class="cols2" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px">
          <label class="field">Partite contemporanee (0 = libere)<input type="number" id="setMaxRooms" min="0" max="100" value="${c.maxRooms}"></label>
          <label class="field">Connessioni per indirizzo (0 = libere)<input type="number" id="setMaxAddr" min="0" max="16" value="${c.maxPerAddress}"></label>
          <label class="field">Giorni di copie delle statistiche<input type="number" id="setBackupDays" min="1" max="365" value="${c.backupDays}"></label>
          <label class="field">Partite tenute nello storico<input type="number" id="setSessions" min="10" max="5000" value="${c.sessionsKept}"></label></div>
        <h3>AppId ammessi (vuoto = tutti)</h3><div class="row"><input type="text" id="setAppIds" class="grow" value="${esc((c.appIds || []).join(', '))}"></div>
        <div class="row end"><button class="btn" data-a="saveSettings" style="--acc:var(--cap)">Salva regolazioni</button></div>`, '--cap')}
      ${sec('Sicurezza', 'Accesso riservato all’amministratore.', `<div class="row"><button class="btn" data-a="password" style="--acc:var(--sci)">Cambia password</button><button class="btn bad" data-a="revokeall">Chiudi tutte le sessioni</button><button class="btn q" data-a="reload">Aggiorna</button></div>
        <h3>Sessioni aperte</h3><div class="scroll"><table><tr><th>Utente</th><th>Indirizzo</th><th>Dal</th><th>Ultima attività</th><th></th></tr>${ad.sessions.map((x) => `<tr><td>${esc(x.user)}</td><td>${esc(x.ip)}</td><td>${when(x.created)}</td><td>${when(x.last)}</td><td><button class="btn q" data-a="revoke" data-id="${esc(x.id)}">Chiudi</button></td></tr>`).join('')}</table></div>
        <h3>Tentativi falliti</h3>${ad.lockouts.length ? `<table><tr><th>Indirizzo</th><th class="n">Tentativi</th><th>Blocco</th></tr>${ad.lockouts.map((l) => `<tr><td>${esc(l.ip)}</td><td class="n">${l.count}</td><td>${l.lockedSec ? `ancora ${l.lockedSec} s` : '-'}</td></tr>`).join('')}</table>` : '<p class="empty">Nessuno.</p>'}`, '--sci')}</div>
      <div>${sec('Azioni', 'Ogni azione finisce nel registro dell’amministratore.', `
        <div class="row"><button class="btn" data-a="backup">Copia di sicurezza completa</button><a class="btn q" href="/api/export">Esporta tutti i dati</a></div>
        <div class="row"><button class="btn bad" data-a="kickall">Scollega tutti</button><button class="btn bad" data-a="restart">Riavvia il relay</button></div>
        <div class="row"><button class="btn q" data-a="clearsessions">Svuota lo storico delle partite</button><button class="btn q" data-a="clearlog">Svuota il registro</button><button class="btn bad" data-a="resetboard">Azzera la classifica</button></div>
        <h3>Copie di sicurezza</h3><div class="scroll"><table><tr><th>File</th><th class="n">Dimensione</th><th>Data</th><th></th></tr>${bk.map((b) => `<tr><td>${esc(b.name)}</td><td class="n">${b.kb} KB</td><td>${when(b.t)}</td><td><a class="btn q" href="/api/backup/file?name=${enc(b.name)}">Scarica</a></td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nessuna copia.</td></tr>'}</table></div>`, '--arm')}
      ${sec('Configurazione attuale', 'Porte e indirizzi si cambiano nel file di configurazione e richiedono un riavvio.', `<div class="kv">${Object.entries(c).map(([k, v]) => `<span>${esc(k)}</span><span>${esc(Array.isArray(v) ? v.join(', ') || '—' : v === '' ? '—' : v)}</span>`).join('')}</div>`, '--dim')}</div></div>`;
  },

  async registro() {
    const [logs, au] = await Promise.all([api('/api/log?n=800' + (logFilter ? '&q=' + enc(logFilter) : '')), api('/api/audit')]);
    return `<div class="cols2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))"><div>${sec('Registro del server', 'Filtra per parola (Invio per applicare).', `<div class="row"><input type="text" id="logQ" class="grow" placeholder="es. rifiutato, cronaca, admin" value="${esc(logFilter)}"></div><pre class="log" id="logPre">${esc(logs.join('\n'))}</pre>`, '--dim')}</div>
      <div>${sec('Azioni dell’amministratore', '', au.length ? `<div class="journal" style="max-height:62vh;--acc:var(--arm)">${au.map((x) => `<div><b>${when(x.t)}</b>${esc(x.action)}${x.detail ? ': ' + esc(x.detail) : ''} <span class="note">${esc(x.ip)}</span></div>`).join('')}</div>` : '<p class="empty">Nessuna azione.</p>', '--arm')}</div></div>`;
  },
};

// grafici disegnati dopo il rendering delle schede che li contengono
async function drawCharts() {
  if (tab === 'plancia') {
    const tel = await api('/api/telemetry');
    chart('c1', [{ data: tel.map((x) => x.players), color: css('--sci') }, { data: tel.map((x) => x.events), color: css('--eng') }]);
    chart('c2', [{ data: tel.map((x) => x.inKBs), color: css('--pil') }, { data: tel.map((x) => x.outKBs), color: css('--cap') }], { unit: ' KB/s' });
  }
  if (tab === 'sistema') {
    const tel = await api('/api/telemetry' + (range === 'day' ? '?range=day' : ''));
    chart('s1', [{ data: tel.map((x) => x.inKBs), color: css('--pil') }, { data: tel.map((x) => x.outKBs), color: css('--cap') }], { unit: ' KB/s' });
    chart('s2', [{ data: tel.map((x) => x.events), color: css('--eng') }, { data: tel.map((x) => x.players), color: css('--sci') }]);
    chart('s3', [{ data: tel.map((x) => x.cpu), color: css('--arm') }, { data: tel.map((x) => x.rssMB / 10), color: css('--vio') }]);
    if (range === 'hour') chart('s4', [{ data: tel.map((x) => x.lagMs), color: css('--warn') }, { data: tel.map((x) => x.lagMaxMs), color: css('--bad') }], { unit: ' ms' });
  }
}

let refreshing = false;
async function refresh(first) {
  if (refreshing) return;
  // non si ridisegna mentre si sta scrivendo in un campo o è aperta una finestra di dialogo
  const a = document.activeElement; if (!first && ($('dlg').open || (a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) && $('view').contains(a)))) return;
  refreshing = true;
  try {
    const pre0 = $('logPre'); const atEnd = !pre0 || pre0.scrollTop + pre0.clientHeight >= pre0.scrollHeight - 20;
    const html = await renderers[tab](); $('view').innerHTML = html; await drawCharts();
    const pre = $('logPre'); if (pre && atEnd) pre.scrollTop = pre.scrollHeight;
    const h = await api('/api/health'); $('hostChip').textContent = (h.maintenance ? 'MANUTENZIONE · ' : '') + `${h.rooms} PARTITE · ${h.players} IN GIOCO`;
  } catch (e) { if (String(e.message) !== 'accesso richiesto') console.warn(e); }
  finally { refreshing = false; }
}

// ---- azioni
document.addEventListener('input', (e) => { if (e.target.id === 'userQ') userFilter = e.target.value; if (e.target.id === 'logQ') logFilter = e.target.value; });
document.addEventListener('change', (e) => { if (e.target.id === 'statSel') { statSel = e.target.value; e.target.blur(); refresh(true); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && ['userQ', 'logQ'].includes(e.target.id)) { e.target.blur(); refresh(true); } if (e.key === 'Enter' && e.target.id === 'annText') document.querySelector('[data-a="annAll"]').click(); });
window.addEventListener('resize', () => drawCharts().catch(() => {}));
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return; const d = b.dataset, room = enc(d.room || '');
  try {
    switch (d.a) {
      case 'room': await act(`/api/room?room=${room}&${d.q}`); break;
      case 'max': { const v = await ask('Capienza della partita', d.room, [{ label: 'Giocatori al massimo (0 = senza limite)', type: 'number', value: '5' }], '--pil'); if (v) await act(`/api/room?room=${room}&max=${enc(v[0])}`); break; }
      case 'close': if (await ask('Terminare la partita?', `Tutti i giocatori di «${d.room}» verranno scollegati.`, [], '--arm', 'Termina')) await act(`/api/close?room=${room}`); break;
      case 'say': { const v = await ask('Messaggio alla partita', d.room, [{ label: 'Testo', max: 200 }], '--cap', 'Trasmetti'); if (v && v[0]) await act(`/api/announce?room=${room}`, { text: v[0] }); break; }
      case 'annAll': { const t = $('annText').value.trim(); if (t) { await act('/api/announce', { text: t }); $('annText').value = ''; } break; }
      case 'whisper': { const v = await ask('Messaggio privato', 'Lo vede solo questo giocatore.', [{ label: 'Testo', max: 200 }], '--pil', 'Invia'); if (v && v[0]) await act(`/api/whisper?room=${room}&actor=${d.actor}`, { text: v[0] }); break; }
      case 'warn': { const v = await ask('Avviso al giocatore', 'Compare a schermo e viene contato nel suo registro.', [{ label: 'Motivo', max: 160 }], '--cap', 'Avvisa'); if (v && v[0]) await act(`/api/warn?room=${room}&actor=${d.actor}`, { text: v[0] }); break; }
      case 'kick': if (await ask('Espellere il giocatore?', 'Potrà rientrare subito.', [], '--arm', 'Espelli')) await act(`/api/kick?room=${room}&actor=${d.actor}`); break;
      case 'kickuser': if (await ask('Scollegare il giocatore?', 'Chiude tutte le sue connessioni, in lobby e in partita.', [], '--arm', 'Scollega')) await act(`/api/kickuser?userId=${enc(d.user)}`); break;
      case 'ban': { const v = await ask(`Escludere ${d.name}?`, 'Il giocatore viene scollegato e non potrà rientrare.', [{ label: 'Motivo', max: 120 }, { label: 'Durata', type: 'select', options: BANTIME }], '--arm', 'Escludi'); if (v) await act('/api/ban', { userId: d.user, reason: v[0], minutes: Number(v[1]) }); break; }
      case 'banip': { const v = await ask('Escludere un indirizzo', 'Nessuna connessione da questo indirizzo verrà accettata.', [{ label: 'Indirizzo IP' }, { label: 'Motivo', max: 120 }, { label: 'Durata', type: 'select', options: BANTIME }], '--arm', 'Escludi'); if (v && v[0]) await act('/api/ban', { address: v[0].trim(), reason: v[1], minutes: Number(v[2]) }); break; }
      case 'unban': await act(`/api/unban?${d.k}=${enc(d.v)}`); break;
      case 'note': { const v = await ask('Nota sul giocatore', 'Visibile solo nel pannello.', [{ label: 'Nota', type: 'textarea', value: d.notes }], '--sci', 'Salva'); if (v) await act(`/api/user/note?userId=${enc(d.user)}`, { notes: v[0] }); break; }
      case 'delsaga': if (await ask('Eliminare la cronaca?', `Galassia ${d.seed}: archi, fama e conseguenze in attesa.`, [], '--arm', 'Elimina')) await act(`/api/saga/delete?seed=${d.seed}`); break;
      case 'delrival': if (await ask('Eliminare la fazione rivale?', `Galassia ${d.seed}: alla prossima partita ne nascerà una nuova.`, [], '--arm', 'Elimina')) await act(`/api/rival/delete?seed=${d.seed}`); break;
      case 'delplayer': if (await ask(`Eliminare il profilo di ${d.name}?`, 'Esce dalla classifica; tornerà alla prossima sincronizzazione del giocatore.', [], '--arm', 'Elimina')) await act(`/api/player/delete?id=${enc(d.id)}`); break;
      case 'range': range = d.r; break;
      case 'reload': break;
      case 'saveSettings': {
        const r = await act('/api/settings', { maintenance: $('setMaint').checked, maintenanceMessage: $('setMaintMsg').value, motd: $('setMotd').value, maxRooms: $('setMaxRooms').value, maxPerAddress: $('setMaxAddr').value, backupDays: $('setBackupDays').value, sessionsKept: $('setSessions').value, appIds: $('setAppIds').value });
        await ask('Regolazioni salvate', r.ok ? 'Le modifiche sono attive.' : 'Salvataggio non riuscito.', [], '--cap', 'Chiudi'); break;
      }
      case 'backup': { const r = await act('/api/backup'); await ask('Copia di sicurezza', r.name ? `Creata: ${r.name}` : 'Non riuscita.', [], '--pil', 'Chiudi'); break; }
      case 'kickall': if (await ask('Scollegare tutti?', 'Ogni giocatore, in lobby e in partita, viene scollegato.', [], '--arm', 'Scollega tutti')) await act('/api/kickall'); break;
      case 'restart': if (await ask('Riavviare il relay?', 'Le partite in corso vengono chiuse; il servizio riparte da solo in pochi secondi.', [], '--arm', 'Riavvia')) { await act('/api/restart'); setTimeout(() => location.reload(), 6000); } break;
      case 'clearsessions': if (await ask('Svuotare lo storico?', 'Le partite concluse vengono dimenticate.', [], '--arm', 'Svuota')) await act('/api/sessions/clear'); break;
      case 'clearlog': if (await ask('Svuotare il registro?', 'Solo le righe in memoria: il registro di sistema resta.', [], '--arm', 'Svuota')) await act('/api/log/clear'); break;
      case 'resetboard': if (await ask('Azzerare la classifica?', 'Prima viene fatta una copia di sicurezza completa.', [], '--arm', 'Azzera')) await act('/api/leaderboard/reset'); break;
      case 'password': {
        const v = await ask('Cambia password', 'Almeno 8 caratteri.', [{ label: 'Password attuale', type: 'password', ac: 'current-password' }, { label: 'Nuova password', type: 'password', ac: 'new-password' }, { label: 'Ripeti la nuova password', type: 'password', ac: 'new-password' }], '--sci', 'Cambia');
        if (!v) break; if (v[1] !== v[2]) { await ask('Le password non coincidono', '', [], '--arm', 'Chiudi'); break; }
        const r = await act('/api/password', { old: v[0], next: v[1] }); await ask(r.ok ? 'Password cambiata' : 'Password non cambiata', r.error || '', [], r.ok ? '--sci' : '--arm', 'Chiudi'); break;
      }
      case 'revoke': await act(`/api/admins/revoke?id=${enc(d.id)}`); break;
      case 'revokeall': if (await ask('Chiudere tutte le sessioni?', 'Anche questa: dovrai accedere di nuovo.', [], '--arm', 'Chiudi tutte')) { await act('/api/admins/revokeall'); location.reload(); } break;
      default: return;
    }
  } catch (err) { console.warn(err); }
  refresh(true);
});

start();
</script>
</html>
